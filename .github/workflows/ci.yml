name: Build and Package
on:
  pull_request:
    paths:
      - "assets/**"
      - "VDXROVR-Installer/**"
      - "src/**"
      - "third-party/**"
      - "*.props"
      - "*.cmake"
      - "CMakeLists.txt"
      - ".github/workflows/ci.yml"
  push:
    paths:
      - "assets/**"
      - "VDXROVR-Installer/**"
      - "src/**"
      - "third-party/**"
      - "*.props"
      - "*.cmake"
      - "CMakeLists.txt"
      - ".github/workflows/ci.yml"
  workflow_dispatch:
permissions:
  packages: write
env:
  USERNAME: ${{github.repository_owner}}
  FEED_URL: https://nuget.pkg.github.com/${{github.repository_owner}}/index.json
  VCPKG_BINARY_SOURCES: "clear;nuget,https://nuget.pkg.github.com/${{github.repository_owner}}/index.json,${{ github.event_name == 'push' && 'readwrite' || 'read' }}"
jobs:
  section3-preflight:
    name: License Section 3 & Patch Pre-Flight Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate License Section 3 compliance & patch integrity
        shell: python
        env:
          REPO_SLUG: ${{ github.repository }}
        run: |
          import os, re, subprocess, sys
          repo_slug = os.environ.get("REPO_SLUG", "")
          files = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          errors = []

          # 1. Detect leftover conflict markers or rejected patch hunks before build
          text_exts = {
              ".c", ".cc", ".cpp", ".cxx", ".h", ".hpp", ".hxx", ".inl", ".idl",
              ".in", ".rc", ".manifest", ".cmake", ".txt", ".json", ".yml", ".yaml",
              ".ps1", ".py", ".sh", ".wxs", ".wprp", ".xaml", ".js", ".ts", ".md",
          }
          for path in files:
              if path.endswith((".rej", ".orig")):
                  errors.append(f"{path}:0 [patch-reject] Rejected/backup patch file blocks clean apply")
                  continue
              if path.startswith("third-party/") and not path.startswith("third-party/vcpkg-overlays/"):
                  continue
              ext = os.path.splitext(path)[1].lower()
              base = os.path.basename(path)
              if ext not in text_exts and base != "CMakeLists.txt":
                  continue
              try:
                  with open(path, "r", encoding="utf-8", errors="ignore") as f:
                      lines = f.readlines()
                  has_conflict_start = any(l.startswith("<<<<<<< ") for l in lines)
                  for idx, line in enumerate(lines, 1):
                      if line.startswith(("<<<<<<< ", ">>>>>>> ")) or (has_conflict_start and line.rstrip("\r\n") == "======="):
                          errors.append(f"{path}:{idx} [conflict-marker] {line.strip()[:80]}")
              except OSError:
                  pass

          # 2. Enforce License Section 3 compliance & path integrity on forks
          if repo_slug != "Open" + "Kneeboard/" + "Open" + "Kneeboard":
              id_terms = [
                  ("Open" + "Kneeboard", re.compile(r"open" + r"kneeboard", re.I)),
                  ("O" + "KB", re.compile(r"\bo" + r"kb\b|o" + r"kb[_-]|[_-]o" + r"kb", re.I)),
                  ("Fred" + "Emmott", re.compile(r"fred" + r"(?:erick)?\s*emmott", re.I)),
                  ("upstream-guid", re.compile(
                      r"843c9331-" + r"0610-4ab1-9cf9-5305c896fb5b|"
                      r"7d4d2c1b-" + r"3f56-48d8-b47b-5b3f860f8f23|"
                      r"2e4ca00a-" + r"ef2b-4511-9060-c5f87a0bc945", re.I)),
              ]
              exempt_re = re.compile(
                  r"Copyright|LegalCopyright|see the LICENSE file|Original "
                  r"|The majority of Open" + r"Kneeboard is under|Open" + r"Kneeboard repository\."
                  r"|GNU General Public License|#include\s+<Fred" + r"Emmott/"
                  r"|Fred" + r"Emmott::|github\.com/fred" + r"emmott/"
                  r"|github\.com/Open" + r"Kneeboard/(?!Open" + r"Kneeboard(?:\.git\b|$|[/?#\x22\x27)\s>]))"
                  r"|fred" + r"emmott-(?:bindline|weak-refs|cppwinrt|magic-json-serialize-enum|openxr-tracing|\*)"
                  r"|window->SetValue\(\"Open" + r"Kneeboard\"|Open" + r"KneeboardAPI"
                  r"|declare namespace Open" + r"Kneeboard|\.Open" + r"KneeboardPlugin"
                  r"|Id=\"Open" + r"KneeboardPlugin\"|legacyLocal|legacySaved"
                  r"|Section 3\.i exception",
                  re.I,
              )
              path_bad = re.compile(r"open" + r"kneeboard|fred" + r"(?:erick)?\s*emmott|\bo" + r"kb\b", re.I)
              for path in files:
                  if path.startswith("third-party/") and not path.startswith("third-party/vcpkg-overlays/"):
                      continue
                  base = os.path.basename(path)
                  if path_bad.search(base):
                      errors.append(f"{path}:0 [path-collision] Forbidden identifier in file path")
                  if path in ("LICENSE", ".github/workflows/ci.yml"):
                      continue
                  ext = os.path.splitext(path)[1].lower()
                  if ext not in text_exts and base != "CMakeLists.txt":
                      continue
                  try:
                      with open(path, "r", encoding="utf-8", errors="ignore") as f:
                          for idx, line in enumerate(f, 1):
                              if exempt_re.search(line):
                                  continue
                              for term, rx in id_terms:
                                  if rx.search(line):
                                      errors.append(f"{path}:{idx} [{term}] {line.strip()[:100]}")
                                      break
                  except OSError:
                      pass

              with open(".github/workflows/ci.yml", "r", encoding="utf-8") as cf:
                  ci_txt = cf.read()
              if ("Open" + "Kneeboard-GHA") in ci_txt or ("x64-windows-open" + "kneeboard") in ci_txt:
                  errors.append(".github/workflows/ci.yml:0 [section-3.i] Un-rebranded CI artifact or triplet name")
              if "steps.build-installer.outputs.installer-name" in ci_txt and "Source-GHA" not in ci_txt:
                  errors.append(".github/workflows/ci.yml:0 [section-3.ii] Installer upload requires paired Source-GHA archive")
              for m in re.finditer(r"working-directory:\s*source/([^\s]+)", ci_txt):
                  rel_dir = m.group(1).strip()
                  if not os.path.isdir(rel_dir):
                      errors.append(f".github/workflows/ci.yml:0 [path-mismatch] Missing directory for working-directory: {rel_dir}")

          if errors:
              print("::error::Section 3 / Patch pre-flight validation failed:")
              for e in errors[:30]:
                  print("  " + e)
              if len(errors) > 30:
                  print(f"  ... and {len(errors) - 30} more issue(s)")
              sys.exit(1)
          print(f"Pre-flight OK: scanned {len(files)} tracked files with 0 Section 3 or patch collisions.")
  populate-vcpkg-cache:
    name: Populate vcpkg cache (${{matrix.triplet}})
    needs: section3-preflight
    runs-on: windows-2022
    strategy:
      matrix:
        include:
          - triplet: x64-windows-vdxrovr
            extra: ""
          - triplet: x86-windows-static
            extra: "--x-no-default-features"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: 'true'
      - name: Bootstrap vcpkg
        run: third-party/vcpkg/bootstrap-vcpkg.bat
      - name: Add nuget source
        shell: pwsh
        run: |
          .$(third-party/vcpkg/vcpkg fetch nuget) `
            sources add `
            -Source "${{ env.FEED_URL }}" `
            -StorePasswordInClearText `
            -Name GitHubPackages `
            -UserName "${{ env.USERNAME }}" `
            -Password "${{ secrets.GITHUB_TOKEN }}"
          .$(third-party/vcpkg/vcpkg fetch nuget) `
            setapikey "${{ secrets.GITHUB_TOKEN }}" `
            -Source "${{ env.FEED_URL }}"
      - name: "Install dependencies"
        run: third-party/vcpkg/vcpkg install --triplet ${{matrix.triplet}} --clean-after-build ${{matrix.extra}}
  build:
    name: Build (${{matrix.config}})
    needs: [section3-preflight, populate-vcpkg-cache]
    if: ${{ needs.section3-preflight.result == 'success' && !failure() && !cancelled() }}
    runs-on: windows-2022
    strategy:
      matrix:
        config: [RelWithDebInfo]
    steps:
      - uses: actions/checkout@v7
        with:
          path: source
          fetch-depth: 0
          submodules: 'true'
      - name: Bootstrap vcpkg
        run: source/third-party/vcpkg/bootstrap-vcpkg.bat
      - name: Add nuget vcpkg source
        shell: pwsh
        working-directory: source
        run: |
          .$(third-party/vcpkg/vcpkg fetch nuget) `
            sources add `
            -Source "${{ env.FEED_URL }}" `
            -StorePasswordInClearText `
            -Name GitHubPackages `
            -UserName "${{ env.USERNAME }}" `
            -Password "${{ secrets.GITHUB_TOKEN }}"
      - name: Make build directory
        run: cmake -E make_directory build
      - name: Configure
        working-directory: build
        shell: pwsh
        run: |
          cmake ${{github.workspace}}/source `
            -B ${{github.workspace}}/build `
            --preset vcpkg `
            "-DSOURCELINK=https://raw.githubusercontent.com/${{github.repository}}/${{github.sha}}"
      - name: Build
        id: build
        working-directory: build
        run: |
          # Build
          echo "::group::Running cmake --build"
          cmake --build . `
            --config ${{matrix.config}} `
            --parallel `
            -- `
            /p:CL_MPCount=
          echo "::endgroup::"
          echo "::group::Setting version"
          $version="$(Get-Content version.txt)"
          Add-Content $Env:GITHUB_OUTPUT "VERSION=${version}"
          echo "::endgroup::"
      - name: Attach debug symbols
        if: ${{ matrix.config != 'Debug' }}
        uses: actions/upload-artifact@v7
        with:
          name: VDXROVR-GHA${{github.run_number}}-DebugSymbols
          path: build/out/${{matrix.config}}/pdb
      - name: Build installer generator
        if: ${{matrix.config != 'Debug' }}
        shell: pwsh
        working-directory: source/VDXROVR-Installer
        run: |
          dotnet publish `
            --configuration Release `
            --output "${{github.workspace}}/build/out/${{matrix.config}}/installer-generator"
      - name: Attach bundle
        if: ${{ matrix.config != 'Debug' }}
        uses: actions/upload-artifact@v7
        with:
          name: VDXROVR-GHA${{github.run_number}}
          path: |
            build/out/${{matrix.config}}
            !build/out/${{matrix.config}}/pdb
      - name: Install WiX
        run: |
          dotnet tool install --global wix --version 5.0.2
          # Wix5 by default will pull in the Wix6 RC wixext, which isn't compatible
          wix extension add -g WixToolset.UI.wixext/5.0.2
      - name: Build installer
        id: build-installer
        if: ${{matrix.config != 'Debug' }}
        shell: pwsh
        working-directory: build/out/${{matrix.config}}
        run: |
          installer-generator/VDXROVR-Installer.exe `
            "$(Get-Location)" `
            --stamp-file ${{github.workspace}}/installer.stamp
          $InstallerPath = Get-Content ${{github.workspace}}/installer.stamp
          $InstallerName = (Get-Item $InstallerPath).Name
          Add-Content $env:GITHUB_OUTPUT "installer-path=${InstallerPath}"
          Add-Content $env:GITHUB_OUTPUT "installer-name=${InstallerName}"
      - name: Upload unsigned installer
        if: ${{ matrix.config != 'Debug' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{steps.build-installer.outputs.installer-name}}
          path: ${{steps.build-installer.outputs.installer-path}}
      - name: Package source archive (License Section 3.ii)
        if: ${{ matrix.config != 'Debug' }}
        shell: pwsh
        run: |
          $srcZip = "${{github.workspace}}/build/VDXROVR-Source-GHA${{github.run_number}}.zip"
          git -C "${{github.workspace}}/source" archive --format=zip -o $srcZip HEAD
      - name: Upload source archive (License Section 3.ii)
        if: ${{ matrix.config != 'Debug' }}
        uses: actions/upload-artifact@v7
        with:
          name: VDXROVR-Source-GHA${{github.run_number}}
          path: build/VDXROVR-Source-GHA${{github.run_number}}.zip
      - name: Generate release notes
        if: github.ref_type == 'tag' && matrix.config != 'Debug'
        id: release-notes
        run: |
          $out = "${{runner.temp}}/release_notes.md"
            (Get-Content -Path source/.github/workflows/release_notes.md -raw) `
            -replace '@TAG@','${{github.ref_name}}' | `
            Set-Content -Path $out -Encoding UTF8
          Add-Content $Env:GITHUB_OUTPUT "PATH=$out"
      - name: Create draft release
        id: create-release
        if: github.ref_type == 'tag' && matrix.config != 'Debug'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          draft: true
          body_path: ${{steps.release-notes.outputs.PATH}}
          prerelease: ${{contains(github.ref_name, '-')}}
          files: |
            ${{steps.build-installer.outputs.installer-path}}
            ${{github.workspace}}/build/VDXROVR-Source-GHA${{github.run_number}}.zip
